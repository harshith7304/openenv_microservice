[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta_openenv"
version = "2.0.0"
description = "A simulated backend microservice system outlining Database, Auth, and Payment services for debugging."
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "openai",
    "pydantic",
]

[project.scripts]
server = "meta_openenv.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["meta_openenv", "meta_openenv.server"]
package-dir = { "meta_openenv" = ".", "meta_openenv.server" = "server" }
